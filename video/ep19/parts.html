<!doctype html>
<!-- 2판 그래픽 조각 — render_parts.mjs 가 종류마다 값을 바꿔 가며 찍는다(투명 PNG). 크기는 4K 화면 기준 px. -->
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  body { width: 3840px; font-family: var(--disp); }      /* .frame 밖이라 글꼴을 물려받지 못해 대체 글꼴로 찍혔다 */
  .wrap { display: inline-block; padding: 24px; }          /* 그림자 자리 */
  /* 19편 What's New — 기능 카드 A(card2-anim.html) · 썸네일과 같은 결: 둥근 알약 · 앰버 → 핑크 · 문장 대소문자 */
  /* 이름표 — 크림 둥근 상자, 앞에 그라데이션 점 */
  #lbl .box { display: inline-flex; flex-direction: column; background: var(--cream); color: #121016; padding: 22px 38px 26px 34px; border-radius: 26px; box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.5) inset; }
  #lbl .t { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 62px; letter-spacing: -.025em; line-height: 1; white-space: nowrap; }
  #lbl .t::before { content: ""; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #FFC94D, #FF5E8A); flex: none; }
  #lbl .t i { display: none !important; }
  #lbl .s { font-family: var(--mono); font-size: 36px; margin-top: 14px; padding-left: 40px; color: #4A4650; letter-spacing: .01em; white-space: nowrap; }
  /* 자막 */
  #cap .box { display: inline-flex; align-items: center; gap: 28px; padding: 22px 46px 24px 38px; background: rgba(11,10,15,.86); border-radius: 24px; white-space: nowrap; }
  #cap .sq { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #FFC94D, #FF5E8A) !important; flex: none; }
  #cap .x { font-weight: 600; font-size: 64px; letter-spacing: -.01em; color: var(--cream); }
  #cap .k { font-family: var(--mono); font-weight: 500; font-size: 44px; padding: 6px 18px; border: 2px solid var(--rule); border-radius: 12px; color: var(--cream); }
  /* 대사 자막 — 아래 가운데, 둥근 어두운 상자 */
  #sub .box { display: inline-block; padding: 14px 36px 17px; background: rgba(11,10,15,.82); border-radius: 22px; white-space: nowrap; }
  #sub .x { font-weight: 600; font-size: 56px; letter-spacing: -.005em; color: var(--cream); }
  /* 챕터 태그 — 카드의 알약(NEW 01) + 기능 이름(문장 대소문자) */
  #tag .box { display: inline-flex; align-items: center; gap: 26px; }
  #tag .n { font-family: var(--mono); font-weight: 500; font-size: 40px; letter-spacing: .12em; color: #141414; background: linear-gradient(90deg, #FFC94D, #FF5E8A); padding: 11px 26px 9px; border-radius: 999px; box-shadow: 0 8px 30px rgba(255,94,138,.4); white-space: nowrap; }
  #tag .n.chg { background: var(--cream); box-shadow: 0 8px 30px rgba(242,238,228,.2); }
  #tag .t { font-weight: 800; font-size: 66px; letter-spacing: -.03em; color: var(--cream); white-space: nowrap; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
  /* 진행 막대 — 둥근 칸, 지금 것은 그라데이션 */
  #prog .box { display: inline-flex; gap: 14px; padding: 10px 0; }
  #prog .box i { display: block; width: 84px; height: 10px; border-radius: 5px; background: rgba(242,238,228,.18); }
  #prog .box i.done { background: rgba(242,238,228,.55); } #prog .box i.now { background: linear-gradient(90deg, #FFC94D, #FF5E8A); box-shadow: 0 0 16px rgba(255,94,138,.6); }
</style>
<div id="lbl" class="wrap"><div class="box"><div class="t"><i></i><span></span></div><div class="s"></div></div></div>
<div id="cap" class="wrap"><div class="box"><span class="sq"></span><span class="x"></span><span class="k"></span></div></div>
<div id="sub" class="wrap"><div class="box"><span class="x"></span></div></div>
<div id="tag" class="wrap"><div class="box"><span class="n"></span><span class="t"></span></div></div>
<div id="prog" class="wrap"><div class="box"></div></div>
<script>
  const C = { amber: 'var(--bg-lit)', indigo: 'var(--fg-lit)', green: 'var(--ov-lit)', hot: 'var(--hot)', white: 'var(--cream)' };
  window.setLbl = (t, s, color) => {
    const i = document.querySelector('#lbl .t i'); i.style.display = color ? 'block' : 'none'; if (color) i.style.background = C[color];
    document.querySelector('#lbl .t span').textContent = t;
    const ss = document.querySelector('#lbl .s'); ss.textContent = s || ''; ss.style.display = s ? '' : 'none';
  };
  window.setCap = (x, k, color) => {
    document.querySelector('#cap .x').textContent = x;
    const kk = document.querySelector('#cap .k'); kk.textContent = k || ''; kk.style.display = k ? '' : 'none';
    document.querySelector('#cap .sq').style.background = C[color] || 'var(--accent-soft)';
  };
  window.setSub = x => { document.querySelector('#sub .x').textContent = x; };
  window.setTag = (n, t) => { const e = document.querySelector('#tag .n'); e.textContent = n; e.classList.toggle('chg', n === 'CHANGED'); document.querySelector('#tag .t').textContent = t; };
  window.setProg = (k, n) => { document.querySelector('#prog .box').innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < k ? 'done' : i === k ? 'now' : ''}"></i>`).join(''); };
</script>
