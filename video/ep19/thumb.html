<!doctype html>
<!-- 19편 What's New 썸네일 — 본편(어두운 바탕 · 기운 화면)과 확 다르게: 밝은 앰버→핑크 바탕, 검정 큰 글씨. 1280×720 (×2) -->
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  body { margin: 0; }
  #t { position: relative; width: 1280px; height: 720px; overflow: hidden; background: linear-gradient(120deg, #FFC94D 0%, #FF8A5C 48%, #FF5E8A 100%); font-family: var(--disp); color: #141414; }
  #t .tag { position: absolute; left: 56px; top: 50px; font-family: var(--mono); font-weight: 500; font-size: 26px; letter-spacing: .18em; }
  #t .tag b { background: #141414; color: #FFC94D; padding: 6px 14px; border-radius: 8px; font-weight: 500; margin-right: 12px; }
  #t .w { position: absolute; left: 48px; top: 112px; font-weight: 900; font-stretch: 110%; font-size: 112px; line-height: .86; letter-spacing: -.03em; text-transform: uppercase; }

  #t .shot { position: absolute; right: -40px; top: 96px; width: 700px; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 70px rgba(60,10,30,.45), 0 0 0 6px #141414; transform: rotate(3deg); }

  #t .chip { position: absolute; right: 70px; top: 470px; background: #141414; color: #F2EEE4; font-family: var(--mono); font-weight: 500; font-size: 24px; letter-spacing: .14em; padding: 10px 18px; border-radius: 10px; transform: rotate(3deg); }
</style>
<div id="t">

  <div class="w">What's<br>new</div>

  <div class="chip">UPDATE OUTPUT · GRADIENTS · HANDLES</div>
</div>
