<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>html,body{margin:0;background:#000} .s{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;font-family:var(--disp);color:#fff}
.k{font-weight:900;font-stretch:84%;text-transform:uppercase;line-height:.9}</style>
<div class="s" id="hall" style="background:radial-gradient(120% 90% at 30% 100%,#1d3b6a 0%,#0b1430 60%,#05070f 100%)">
 <div style="position:absolute;left:0;right:0;bottom:0;height:420px;background:repeating-linear-gradient(90deg,#0f1b38 0 120px,#13234a 120px 124px);opacity:.8"></div>
 <div style="position:absolute;left:480px;top:180px;width:960px;height:450px;background:#e8eefc;box-shadow:0 0 160px rgba(140,180,255,.6)"></div>
 <div class="k" style="position:absolute;left:540px;top:290px;font-size:118px;color:#0b1430">Riverside<br>Tech Summit</div>
 <div style="position:absolute;left:80px;bottom:60px;font-family:var(--mono);font-size:34px;color:#9fb8ff">MAIN HALL · 2026</div></div>
<div class="s" id="wall" style="background:#f4f1ea;color:#1a1a1a">
 <div class="k" style="position:absolute;left:120px;top:110px;font-size:110px">Thank you<br>to our sponsors</div>
 <div style="position:absolute;left:120px;top:470px;display:grid;grid-template-columns:repeat(3,520px);gap:40px">
  <div style="height:200px;border:4px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800">NORTHWIND</div>
  <div style="height:200px;border:4px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:300;letter-spacing:.2em">LUMEN</div>
  <div style="height:200px;border:4px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:700;font-style:italic">Corvid&amp;Co</div>
  <div style="height:200px;border:4px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:58px;font-family:var(--mono)">tidepool</div>
  <div style="height:200px;border:4px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900">ORBIT·9</div>
  <div style="height:200px;border:4px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:500">Halcyon Labs</div></div></div>
<div class="s" id="crowd" style="background:linear-gradient(#2a1033,#120714)">
 <div style="position:absolute;left:0;right:0;top:120px;height:520px;background:radial-gradient(60% 80% at 50% 0%,rgba(255,180,90,.55),transparent)"></div>
 <div id="heads" style="position:absolute;left:0;right:0;bottom:0;height:520px"></div>
 <div class="k" style="position:absolute;left:120px;top:150px;font-size:96px;color:#ffd9a8">Welcome,<br>everyone</div></div>
<div class="s" id="key" style="background:#0B0B0D">
 <div style="position:absolute;inset:0;background-image:linear-gradient(to right,rgba(242,238,228,.1) 2px,transparent 2px);background-size:320px 100%"></div>
 <div id="bar" style="position:absolute;left:0;top:640px;height:14px;width:0;background:var(--hot)"></div>
 <div class="k" id="kt" style="position:absolute;left:140px;top:300px;font-size:170px;color:var(--cream)">Opening<br>keynote</div>
 <div id="ks" style="position:absolute;left:146px;top:700px;font-family:var(--mono);font-size:44px;color:var(--fg2)">Dana Okafor · 09:30</div></div>
<script>
const h=document.getElementById('heads');let s='';for(let r=0;r<3;r++)for(let i=0;i<26;i++){const x=i*76+(r%2)*38-20,y=r*150+40,sz=110+r*30;s+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${sz}px;height:${sz*1.6}px;border-radius:50% 50% 20% 20%;background:hsl(${290+r*8},30%,${10+r*3}%)"></div>`}h.innerHTML=s;
window.frame=t=>{document.getElementById('bar').style.width=Math.min(1,t/3)*1640+'px';const p=Math.min(1,t/1.2);document.getElementById('kt').style.opacity=p;document.getElementById('kt').style.transform=`translateY(${(1-p)*40}px)`;document.getElementById('ks').style.opacity=Math.min(1,Math.max(0,(t-0.8)/0.8));};
document.fonts.ready.then(()=>window.__ready=true);
</script>
