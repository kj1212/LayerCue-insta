<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../ep14/brand.css">
<style>
body{margin:0;background:transparent;font-family:var(--disp)}
.p{display:none}
.hook{width:1000px;text-align:center;color:var(--cream)}
.hook .k{font:500 30px var(--mono);letter-spacing:.3em;color:var(--fg2)}
.hook .a{font:900 108px/1 var(--disp);letter-spacing:-.01em;margin-top:26px;white-space:nowrap}
.hook .b{font:900 108px/1 var(--disp);color:var(--hot);margin-top:6px;white-space:nowrap}
.word{width:1000px;text-align:center}
.word .w{font:900 170px/1 var(--disp);color:var(--cream);letter-spacing:-.01em;white-space:nowrap}
.word .s{font:500 40px var(--mono);color:var(--fg2);letter-spacing:.06em;margin-top:14px}
.word .s b{color:var(--hot);font-weight:500}
.sub{width:980px;text-align:center;font:800 54px/1.18 var(--disp);color:var(--cream);text-shadow:0 3px 18px rgba(0,0,0,.8)}
.recap{width:1000px;text-align:center}
.recap div{font:900 132px/1.02 var(--disp);color:var(--cream);white-space:nowrap} .recap .h{color:var(--hot)}
.tag{width:1000px;text-align:center;font:500 28px var(--mono);letter-spacing:.12em;color:var(--fg2);white-space:nowrap}
.tag b{color:var(--cream);font-weight:500}
/* 21(What's New) — 본편 카드 A · 썸네일과 같은 결: 둥근 알약 · 앰버 → 핑크 그라데이션 · 문장 대소문자(Archivo 800, 좁은 자간) */
.whatsnew .hook .k{display:none}
.whatsnew .hook .a{font-weight:800;letter-spacing:-.04em;color:var(--cream)}
.whatsnew .hook .b,.whatsnew .recap .h,.whatsnew .word .s b{background:linear-gradient(90deg,#FFC94D,#FF5E8A);-webkit-background-clip:text;color:transparent}
.whatsnew .hook .b{font-weight:800;letter-spacing:-.04em;padding-bottom:10px}
.whatsnew .word .pl{display:inline-block;font:500 34px var(--mono);letter-spacing:.12em;color:#141414;background:linear-gradient(90deg,#FFC94D,#FF5E8A);padding:9px 24px 7px;border-radius:999px;margin-bottom:18px;box-shadow:0 8px 30px rgba(255,94,138,.4)}
.whatsnew .word{text-transform:none}.whatsnew .word .w{text-transform:none;font-weight:800;font-size:150px;letter-spacing:-.045em;line-height:1.02}
.whatsnew .word .s{letter-spacing:.08em;text-transform:uppercase}
.whatsnew .recap div{font-weight:800;letter-spacing:-.04em;font-size:120px}
.whatsnew .tag{display:inline-block;width:auto;padding:14px 30px 12px;border-radius:999px;border:2px solid rgba(242,238,228,.3)}
.whatsnew .tag b{background:linear-gradient(90deg,#FFC94D,#FF5E8A);-webkit-background-clip:text;color:transparent}
</style></head><body>
%BODY%
<script>
// 넘치는 줄은 1000 px 안에 들어가게 글자를 줄인다
// 숨긴 판은 글꼴을 불러오지 않는다 — 재기 전에 직접 불러 둔다(안 그러면 대체 글꼴 폭으로 재서 잘렸다)
Promise.all(['900 108px Archivo', '900 170px Archivo', '800 150px Archivo', '500 40px "DM Mono"', '800 54px Archivo'].map(f => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
  for (const el of document.querySelectorAll('.a,.b,.w,.recap div')) {
    const p = el.closest('.p'); const old = p.style.display; p.style.display = 'inline-block';
    const disp = el.style.display; el.style.display = 'inline-block';      // 블록은 늘 1000 px — 글 폭을 재려면 인라인으로
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.offsetWidth > 980 && fs > 40) { fs -= 2; el.style.fontSize = fs + 'px'; }
    el.style.display = disp;
    p.style.display = old;
  }
  window.__fit = true;
});
</script></body></html>
